    :root {
      --navy: #122430;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--navy);
      color: #fff;
      font-family: "Nanum Gothic", "Noto Sans KR", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* PC·모바일 동일: 시안 이미지 + 투명 클릭 영역 */
    .stage {
      position: relative;
      width: min(100vw, 1280px);
      aspect-ratio: 1280 / 720;
      background: var(--navy) center / 100% 100% no-repeat url("bg.png");
      overflow: hidden;
    }
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 14px;
      z-index: 2;
    }
    .hotspot:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 2px;
    }
    .hs-d1 { left: 36.7%; top: 31.9%; width: 26.6%; height: 7.6%; }
    .hs-d2 { left: 36.7%; top: 43.1%; width: 26.6%; height: 7.6%; }
    .hs-d3 { left: 36.7%; top: 54.2%; width: 26.6%; height: 7.6%; }
    .hs-slot { left: 33.6%; top: 80.6%; width: 16.4%; height: 5.6%; border-radius: 999px; }
    .hs-tg { left: 51.6%; top: 80.6%; width: 16.4%; height: 5.6%; border-radius: 999px; }

    /* 좁은 화면: 가로로 꽉 채우고 세로 비율 유지 (시안 그대로) */
    @media (max-width: 900px) {
      body { align-items: flex-start; padding-top: 0; }
      .stage {
        width: 100vw;
        max-width: 100vw;
        border-radius: 0;
      }
    }
  </style>
</head>
