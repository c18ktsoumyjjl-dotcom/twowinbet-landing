<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>투윈BET 접속 안내</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root { --navy: #122430; --mint: #2EE8A8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--navy);
      -webkit-tap-highlight-color: transparent;
    }
    .frame {
      position: relative;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      line-height: 0;
    }
    .art {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 12px;
    }
    .hotspot:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 2px;
    }
    /* PC 가로 시안 핫스팟 */
    .hs-d1 { left: 36.7%; top: 31.9%; width: 26.6%; height: 7.6%; }
    .hs-d2 { left: 36.7%; top: 43.1%; width: 26.6%; height: 7.6%; }
    .hs-d3 { left: 36.7%; top: 54.2%; width: 26.6%; height: 7.6%; }
    .hs-slot { left: 33.6%; top: 80.6%; width: 16.4%; height: 5.6%; border-radius: 999px; }
    .hs-tg { left: 51.6%; top: 80.6%; width: 16.4%; height: 5.6%; border-radius: 999px; }

    @media (min-width: 901px) {
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    /* 모바일: 세로 시안 + 화면 꽉 채움(cover) */
    @media (max-width: 900px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }
      .frame {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: none;
        /* 1024×1536 = 2:3 */
        width: max(100vw, calc(100svh * 2 / 3));
        height: max(100svh, calc(100vw * 3 / 2));
      }
      .art {
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .hs-d1 { left: 25.8%; top: 60.9%; width: 48.8%; height: 7.4%; }
      .hs-d2 { left: 25.8%; top: 70.1%; width: 48.8%; height: 7.4%; }
      .hs-d3 { left: 25.8%; top: 79.2%; width: 48.8%; height: 7.4%; }
      .hs-slot { left: 17.1%; top: 89.1%; width: 31.6%; height: 5.9%; border-radius: 999px; }
      .hs-tg { left: 51.5%; top: 89.1%; width: 31.9%; height: 5.9%; border-radius: 999px; }
    }
  </style>
</head>
<body>
  <main class="frame" role="main" aria-label="투윈BET 접속 안내">
    <picture>
      <source media="(max-width: 900px)" srcset="bg-mobile.png" />
      <img class="art" src="bg.png" width="1280" height="720" alt="투윈BET 접속 안내" />
    </picture>
    <a class="hotspot hs-d1" href="https://sgo688.com" target="_blank" rel="noopener noreferrer" aria-label="sgo688.com"></a>
    <a class="hotspot hs-d2" href="https://sgo334.com" target="_blank" rel="noopener noreferrer" aria-label="sgo334.com"></a>
    <a class="hotspot hs-d3" href="https://sg778.com" target="_blank" rel="noopener noreferrer" aria-label="sg778.com"></a>
    <a class="hotspot hs-slot" href="https://live.twowintv.com" target="_blank" rel="noopener noreferrer" aria-label="슬롯방송 바로가기"></a>
    <a class="hotspot hs-tg" href="https://t.me/member_inquiry_cs_bot" target="_blank" rel="noopener noreferrer" aria-label="텔레그램 바로가기"></a>
  </main>
</body>
</html>
